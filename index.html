<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logan's Wishlist</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f9f9f9;
      color: #222;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p.subtitle { color: #666; margin-bottom: 32px; }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 12px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Logan's Wishlist</h1>
  <p class="subtitle">Things I want</p>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>
</body>
</html>
